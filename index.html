<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shawmava's Birthday Mixtape 🎵</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #fff7ad 0%, #ffed7b 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            gap: 40px;
        }

        /* NAME LETTERS AREA */
        .name-banner {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .name-letter {
            font-size: 40px;
            padding: 0 8px;
            color: #333;
            opacity: 0.4;
            transition: 0.3s;
        }

        .name-letter.active {
            font-weight: bold;
            opacity: 1;
            font-size: 50px;
        }

        .song-title-display {
            margin-top: 5px;
            font-size: 18px;
            color: #444;
        }

        /* CASSETTE AREA (your original) */
        .container { max-width: 500px; width: 100%; }
        .cassette {
            background: linear-gradient(to bottom, #2c2c2c 0%, #1a1a1a 100%);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .cassette-top {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 3px solid #333;
        }
        .label { background: #f5e6d3; border-radius: 5px; padding: 15px; margin-bottom: 15px; text-align: center; }

        .reels { display: flex; justify-content: space-around; align-items: center; gap: 20px; }
        .reel {
            width: 80px; height: 80px;
            background: #333; border-radius: 50%; border: 8px solid #555;
            position: relative;
            animation: spin 3s linear infinite;
            animation-play-state: paused;
        }
        .reel.playing { animation-play-state: running; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        button {
            background: #444; color: #fff;
            padding: 12px 20px; border-radius: 8px; border: none;
            cursor: pointer; font-size: 1.1em;
        }

        /* NOTEBOOK / MESSAGE BOX */
        .note-box {
            width: 320px;
            background: #fffefa;
            border: 2px solid #e0d8b0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            font-family: Georgia, serif;
            line-height: 1.6em;
            position: sticky;
            top: 20px;
        }

        #noteText {
            white-space: pre-line;
            font-size: 16px;
            color: #444;
        }

        #player { display: none; }
    </style>
</head>

<body>

    <!-- LEFT SIDE: Cassette + Name -->
    <div class="left-side">

        <!-- NAME BANNER -->
        <div class="name-banner" id="nameBanner">
            <!-- letters will auto-load here -->
        </div>
        <div class="song-title-display" id="songTitleDisplay">Press play to begin</div>

        <!-- CASSETTE -->
        <div class="container">
            <div class="cassette">
                <div class="cassette-top">
                    <div class="label">
                        <h2>🎵 Shawmava's Birthday Mixtape</h2>
                        <p>Made with ♥</p>
                    </div>

                    <div class="reels">
                        <div class="reel"></div>
                        <div class="reel"></div>
                    </div>
                </div>

                <div class="controls">
                    <button onclick="previousTrack()">⏮️ Prev</button>
                    <button onclick="togglePlay()" id="playBtn">▶️ Play</button>
                    <button onclick="nextTrack()">⏭️ Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE: NOTE BOX -->
    <div class="note-box">
        <div id="noteText">Press play to read your first message ♥</div>
    </div>

    <!-- YT PLAYER -->
    <div id="player"></div>

    <script>
        /* SONG LIST */
        const playlist = [
            'lAsxLc9_45w',
            'KQ6zr6kCPj8',
            'kJQP7kiw5Fk',
            'fJ9rUzIMcZQ',
            '60ItHLz5WEA',
            'hTWKbfoikeg',
            'y6Sxv-sUYtM',
            '9bZkp7q19f0'
        ];

        /* SONG TITLES (YOU WILL EDIT THESE NAMES) */
        const songNames = [
            "Song 1 Name Here",
            "Song 2 Name Here",
            "Song 3 Name Here",
            "Song 4 Name Here",
            "Song 5 Name Here",
            "Song 6 Name Here",
            "Song 7 Name Here",
            "Song 8 Name Here"
        ];

        /* PERSONAL NOTES FOR EACH SONG (YOU WILL EDIT THESE TEXTS) */
        const notes = [
            "Message for Song 1 goes here...",
            "Message for Song 2 goes here...",
            "Message for Song 3 goes here...",
            "Message for Song 4 goes here...",
            "Message for Song 5 goes here...",
            "Message for Song 6 goes here...",
            "Message for Song 7 goes here...",
            "Message for Song 8 goes here..."
        ];

        /* NAME LETTERS */
        const name = "SHAWMAVA".split("");

        const nameBanner = document.getElementById("nameBanner");
        name.forEach((letter, index) => {
            const span = document.createElement("span");
            span.classList.add("name-letter");
            span.id = "letter-" + index;
            span.textContent = letter;
            nameBanner.appendChild(span);
        });

        let player;
        let currentTrack = 0;
        let isPlaying = false;

        /* YOUTUBE API */
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                videoId: playlist[0],
                events: {
                    'onReady': () => updateUI(),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) nextTrack();
        }

        function togglePlay() {
            if (!isPlaying) {
                player.playVideo();
                document.getElementById("playBtn").textContent = "⏸️ Pause";
                isPlaying = true;
                document.querySelectorAll(".reel").forEach(r => r.classList.add("playing"));
            } else {
                player.pauseVideo();
                document.getElementById("playBtn").textContent = "▶️ Play";
                isPlaying = false;
                document.querySelectorAll(".reel").forEach(r => r.classList.remove("playing"));
            }
        }

        function nextTrack() {
            currentTrack = (currentTrack + 1) % playlist.length;
            player.loadVideoById(playlist[currentTrack]);
            updateUI();
        }

        function previousTrack() {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            player.loadVideoById(playlist[currentTrack]);
            updateUI();
        }

        /* UPDATE EVERYTHING (letters, title, note) */
        function updateUI() {
            // highlight correct letter
            document.querySelectorAll(".name-letter").forEach(el => el.classList.remove("active"));
            document.getElementById("letter-" + currentTrack).classList.add("active");

            // show correct song name
            document.getElementById("songTitleDisplay").textContent = songNames[currentTrack];

            // show correct note
            document.getElementById("noteText").textContent = notes[currentTrack];
        }
    </script>

</body>
</html>
